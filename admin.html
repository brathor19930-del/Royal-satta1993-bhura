<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Satta 1993 - Ultimate Secure Super Admin Panel</title>
    <!-- Firebase SDK Scripts (Firestore only) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 5px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .admin-login-box { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 15px; padding: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .admin-login-box h2 { color: #d4af37; margin-bottom: 20px; font-size: 22px; }
        .admin-login-box input, .admin-login-box select { width: 100%; background: #262626; border: 1px solid #444; padding: 14px; border-radius: 8px; color: #fff; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; }
        
        .login-btn { width: 100%; background: linear-gradient(90deg, #d4af37, #aa8c2c); color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(212,175,55,0.3); }
        
        .dashboard-box { display: none; background: #1a1a1a; border: 2px solid #d4af37; padding: 12px; border-radius: 10px; width: 100%; max-width: 98vw; height: 98vh; flex-direction: column; box-shadow: 0 4px 30px rgba(0,0,0,0.9); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; flex-shrink: 0; }
        .dash-header h3 { color: #4caf50; font-size: 16px; }
        
        .section-title { color: #d4af37; font-size: 15px; font-weight: bold; margin: 5px 0; text-align: center; }
        
        .menu-bar-container { position: relative; margin-bottom: 8px; flex-shrink: 0; }
        .menu-toggle-btn { background: #222; border: 1px solid #d4af37; color: #d4af37; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #1a1a1a; border: 1px solid #d4af37; border-radius: 8px; width: 310px; box-shadow: 0 5px 15px rgba(0,0,0,0.9); z-index: 999; max-height: 400px; overflow-y: auto; }
        .dropdown-menu button { display: block; width: 100%; background: none; border: none; color: #fff; padding: 10px 15px; text-align: left; font-size: 13px; cursor: pointer; border-bottom: 1px solid #333; font-weight: bold; }
        .dropdown-menu button:hover { background: #262626; color: #d4af37; }
        
        .back-btn { background: linear-gradient(90deg, #333, #222); color: #d4af37; border: 1px solid #d4af37; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .back-btn:hover { background: #d4af37; color: #000; }

        .admin-folder { display: none; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .admin-folder.active { display: flex; }

        .grid-chart-table { width: 100%; border-collapse: collapse; font-size: 16px; background: #1a1a1a; flex-grow: 1; display: block; overflow-y: auto; margin-top: 5px; border: 1px solid #444; }
        .grid-chart-table th, .grid-chart-table td { border: 1px solid #444; padding: 10px 6px; text-align: center; }
        .grid-chart-table th { background: #262626; color: #d4af37; position: sticky; top: 0; font-size: 15px; z-index: 10; }
        .grid-chart-table tr:nth-child(even) { background: #222; }

        .subadmin-form { background: #222; border: 1px solid #444; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .subadmin-form input, .subadmin-form select, .subadmin-form textarea { width: 100%; background: #1a1a1a; border: 1px solid #555; padding: 10px; border-radius: 6px; color: #fff; margin-bottom: 8px; font-size: 14px; outline: none; }
    </style>
</head>
<body>

    <!-- LOGIN VIEW -->
    <div id="adminLoginView" class="admin-login-box">
        <h2>👑 SECURE ADMIN LOGIN</h2>
        <input type="tel" id="adminMob" placeholder="Enter Super Mobile No" maxlength="10">
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button class="login-btn" onclick="verifyLogin()">SECURE LOGIN</button>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="adminDashboardView" class="dashboard-box">
        <div class="dash-header">
            <h3 id="welcomeAdminText">Login Successful!</h3>
            <button onclick="logoutAdmin()" style="background: #b71c1c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">LOGOUT</button>
        </div>

        <div class="menu-bar-container">
            <button class="menu-toggle-btn" onclick="toggleMenu()">☰ MENU / SECTIONS</button>
            <div id="dropdownMenu" class="dropdown-menu">
                <button onclick="switchFolder('frontchart')">📊 Live Bids (00-99)</button>
                <button onclick="switchFolder('ledger')">💳 Manual Wallet Ledger</button>
                <button onclick="switchFolder('upiqrsettings')">📱 Admin UPI & QR Code Manager</button>
                <button onclick="switchFolder('results')">🏆 Declare Result</button>
            </div>
        </div>

        <!-- 1. LIVE BIDS -->
        <div id="folderFrontChart" class="admin-folder active">
            <div class="section-title">📊 LIVE 00 TO 99 BIDS TRACKER</div>
            <select id="frontMarketSelect" onchange="renderFrontGridChart()" style="width: 100%; background: #262626; color: #fff; padding: 10px; border: 1px solid #444; border-radius: 6px; margin-bottom: 6px; font-size: 14px; font-weight: bold; flex-shrink: 0;">
                <option value="DELHI BAZAR">DELHI BAZAR</option>
                <option value="SRIGANESH">SRIGANESH</option>
                <option value="FARIDABAD">FARIDABAD</option>
                <option value="DHAN LAXMI">DHAN LAXMI</option>
                <option value="786">786</option>
                <option value="GHAZIABAD">GHAZIABAD</option>
                <option value="GALI">GALI</option>
                <option value="DESAWER">DESAWER</option>
            </select>
            <table class="grid-chart-table">
                <thead>
                    <tr>
                        <th style="width:15%;">Jodi</th>
                        <th style="width:35%;">Amount (₹)</th>
                        <th style="width:15%;">Jodi</th>
                        <th style="width:35%;">Amount (₹)</th>
                    </tr>
                </thead>
                <tbody id="frontGridTableBody"></tbody>
            </table>
        </div>

        <!-- 2. MANUAL WALLET LEDGER -->
        <div id="folderLedger" class="admin-folder" style="overflow-y: auto;">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">💳 MANUAL WALLET LEDGER</div>
            <div class="subadmin-form">
                <input type="text" id="ledgerUserPhone" placeholder="Enter User Phone (e.g. 9876543210)">
                <select id="ledgerActionType">
                    <option value="credit">➕ Add Balance (Credit)</option>
                    <option value="debit">➖ Deduct Balance (Debit)</option>
                </select>
                <input type="number" id="ledgerAmount" placeholder="Enter Amount (Coins)">
                <input type="text" id="ledgerRemark" placeholder="Remark / Reason (Optional)">
                <button class="login-btn" onclick="executeWalletUpdate()">EXECUTE WALLET UPDATE</button>
            </div>
        </div>

        <!-- 3. UPI & GALLERY QR UPLOAD MANAGER -->
        <div id="folderUpiQrSettings" class="admin-folder" style="overflow-y: auto;">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">📱 ADMIN UPI ID & QR CODE MANAGER</div>
            <div class="subadmin-form">
                <label style="font-size:12px; color:#d4af37;">Active Admin UPI ID:</label>
                <input type="text" id="adminUpiIdInput" placeholder="e.g. admin@upi">
                
                <label style="font-size:12px; color:#d4af37; margin-top:8px; display:block;">Select QR Code Image from Gallery:</label>
                <input type="file" id="adminQrImageFile" accept="image/*" style="font-size: 13px; padding: 8px;">
                
                <div style="text-align:center; margin:10px 0;">
                    <img id="currentQrPreview" src="" style="width:120px; height:120px; display:none; border:1px solid #d4af37; border-radius:6px;" alt="QR Preview">
                </div>

                <button class="login-btn" onclick="saveAdminUpiQr()" style="margin-top: 5px; padding: 12px; font-size: 14px;">UPDATE UPI & QR LIVE</button>
            </div>
        </div>

        <!-- 4. DECLARE RESULT -->
        <div id="folderResults" class="admin-folder" style="overflow-y: auto;">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">🏆 DECLARE MARKET RESULT</div>
            <div class="subadmin-form">
                <select id="adminMarketSelect">
                    <option value="DELHI BAZAR">DELHI BAZAR</option>
                    <option value="SRIGANESH">SRIGANESH</option>
                    <option value="FARIDABAD">FARIDABAD</option>
                    <option value="DHAN LAXMI">DHAN LAXMI</option>
                    <option value="786">786</option>
                    <option value="GHAZIABAD">GHAZIABAD</option>
                    <option value="GALI">GALI</option>
                    <option value="DESAWER">DESAWER</option>
                </select>
                <input type="text" id="adminResultInput" placeholder="Enter 2-digit number (e.g. 45)" maxlength="2">
                <button class="login-btn" onclick="adminDeclareResult()">DECLARE RESULT LIVE</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCz-hJxuNnIZcYQhkS1Etshv1C_dhKMSTY",
            authDomain: "royal-satta-1993.firebaseapp.com",
            projectId: "royal-satta-1993",
            storageBucket: "royal-satta-1993.firebasestorage.app",
            messagingSenderId: "565178922133",
            appId: "1:565178922133:web:4ef7e5c32d01b95589579c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function verifyLogin() {
            let mob = document.getElementById('adminMob').value.trim();
            let pass = document.getElementById('adminPass').value.trim();
            
            if(mob === "8076010690" && pass === "1993") {
                document.getElementById('adminLoginView').style.display = 'none';
                document.getElementById('adminDashboardView').style.display = 'flex';
                document.getElementById('welcomeAdminText').innerText = "SuperAdmin: " + mob;
                loadAdminUpiSettings();
            } else {
                alert("गलत मोबाइल नंबर या पासवर्ड! (सही नंबर: 8076010690, पासवर्ड: 1993 दर्ज करें)");
            }
        }

        function logoutAdmin() { location.reload(); }

        function toggleMenu() {
            let menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function switchFolder(folderId) {
            document.querySelectorAll('.admin-folder').forEach(f => f.classList.remove('active'));
            let target = document.getElementById('folder' + folderId.charAt(0).toUpperCase() + folderId.slice(1));
            if(target) target.classList.add('active');
            document.getElementById('dropdownMenu').style.display = 'none';
            if(folderId === 'frontchart') { renderFrontGridChart(); }
        }

        function executeWalletUpdate() {
            let phoneInput = document.getElementById('ledgerUserPhone').value.trim();
            let action = document.getElementById('ledgerActionType').value;
            let amount = parseInt(document.getElementById('ledgerAmount').value) || 0;

            if(!phoneInput || amount <= 0) {
                alert("कृपया वैध फोन नंबर और राशि दर्ज करें!");
                return;
            }

            let formattedPhone = phoneInput.startsWith('+91') ? phoneInput : '+91' + phoneInput;
            let userRef = db.collection("users").doc(formattedPhone);

            userRef.get().then((doc) => {
                let currentWallet = 0;
                if(doc.exists && doc.data().wallet) {
                    currentWallet = doc.data().wallet;
                }

                let newWallet = action === 'credit' ? currentWallet + amount : currentWallet - amount;
                if(newWallet < 0) newWallet = 0;

                userRef.set({
                    phone: formattedPhone,
                    wallet: newWallet,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(() => {
                    alert(`सफलतापूर्वक ${action === 'credit' ? 'जोड़े गए' : 'काटे गए'}! नया बैलेंस: ₹${newWallet}`);
                    document.getElementById('ledgerAmount').value = '';
                }).catch(err => { alert("त्रुटि: " + err.message); });
            });
        }

        function saveAdminUpiQr() {
            let upiId = document.getElementById('adminUpiIdInput').value.trim();
            let fileInput = document.getElementById('adminQrImageFile');

            let saveData = (qrBase64) => {
                let payload = { upiId: upiId, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                if(qrBase64 !== undefined) payload.qrCodeUrl = qrBase64;

                db.collection("settings").doc("payment").set(payload, { merge: true }).then(() => {
                    alert("UPI ID और QR Code सफलतापूर्वक लाइव अपडेट हो गए हैं!");
                }).catch(err => { alert("त्रुटि: " + err.message); });
            };

            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    saveData(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveData(undefined);
            }
        }

        function loadAdminUpiSettings() {
            db.collection("settings").doc("payment").get().then((doc) => {
                if(doc.exists) {
                    let data = doc.data();
                    if(data.upiId) document.getElementById('adminUpiIdInput').value = data.upiId;
                    if(data.qrCodeUrl) {
                        let prev = document.getElementById('currentQrPreview');
                        prev.src = data.qrCodeUrl;
                        prev.style.display = 'inline-block';
                    }
                }
            });
        }

        function adminDeclareResult() {
            let market = document.getElementById('adminMarketSelect').value;
            let resNum = document.getElementById('adminResultInput').value.trim();

            if(!resNum || resNum.length !== 2) {
                alert("कृपया वैध 2-अंकों की संख्या दर्ज करें (जैसे 45)!");
                return;
            }

            db.collection("Results").doc(market).set({
                winningNumber: resNum,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                alert(`मार्केट ${market} का परिणाम ${resNum} सफलतापूर्वक घोषित कर दिया गया है!`);
                document.getElementById('adminResultInput').value = '';
            }).catch(err => { alert("त्रुटि: " + err.message); });
        }

        function renderFrontGridChart() {
            let tableBody = document.getElementById('frontGridTableBody');
            if(!tableBody) return;
            tableBody.innerHTML = '';

            for(let i=0; i<50; i++) {
                let n1 = i < 10 ? '0' + i : '' + i;
                let n2 = (i + 50) < 10 ? '0' + (i + 50) : '' + (i + 50);
                tableBody.innerHTML += `
                    <tr>
                        <td style="color:#d4af37; font-weight:bold;">${n1}</td>
                        <td id="bid_amt_${n1}">₹0</td>
                        <td style="color:#d4af37; font-weight:bold;">${n2}</td>
                        <td id="bid_amt_${n2}">₹0</td>
                    </tr>
                `;
            }

            let market = document.getElementById('frontMarketSelect').value;
            db.collection("bids").where("market", "==", market).onSnapshot((snapshot) => {
                let totals = {};
                snapshot.forEach(doc => {
                    let data = doc.data();
                    let num = data.number ? data.number.replace('J-', '') : '';
                    let amt = data.amount || 0;
                    if(num.length === 2) { totals[num] = (totals[num] || 0) + amt; }
                });

                for(let key in totals) {
                    let cell = document.getElementById('bid_amt_' + key);
                    if(cell) {
                        cell.innerText = '₹' + totals[key];
                        cell.style.color = '#4caf50';
                        cell.style.fontWeight = 'bold';
                    }
                }
            });
        }
    </script>
</body>
</html>
