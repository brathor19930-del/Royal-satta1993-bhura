<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Satta 1993 - Ultimate Secure Super Admin Panel</title>
    <!-- Firebase SDK Scripts (Compat versions) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 5px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .admin-login-box { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 15px; padding: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .admin-login-box h2 { color: #d4af37; margin-bottom: 20px; font-size: 22px; }
        .admin-login-box input, .admin-login-box select { width: 100%; background: #262626; border: 1px solid #444; padding: 14px; border-radius: 8px; color: #fff; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center; }
        
        .login-btn { width: 100%; background: linear-gradient(90deg, #d4af37, #aa8c2c); color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(212,175,55,0.3); }
        
        .dashboard-box { display: none; background: #1a1a1a; border: 2px solid #d4af37; padding: 12px; border-radius: 10px; width: 100%; max-width: 98vw; height: 98vh; flex-direction: column; box-shadow: 0 4px 30px rgba(0,0,0,0.9); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; flex-shrink: 0; }
        .dash-header h3 { color: #4caf50; font-size: 16px; }
        
        .section-title { color: #d4af37; font-size: 15px; font-weight: bold; margin: 5px 0; text-align: center; }
        
        .menu-bar-container { position: relative; margin-bottom: 8px; flex-shrink: 0; }
        .menu-toggle-btn { background: #222; border: 1px solid #d4af37; color: #d4af37; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #1a1a1a; border: 1px solid #d4af37; border-radius: 8px; width: 290px; box-shadow: 0 5px 15px rgba(0,0,0,0.9); z-index: 999; max-height: 60vh; overflow-y: auto; }
        .dropdown-menu button { display: block; width: 100%; background: none; border: none; color: #fff; padding: 10px 15px; text-align: left; font-size: 13px; cursor: pointer; border-bottom: 1px solid #333; font-weight: bold; }
        .dropdown-menu button:hover { background: #262626; color: #d4af37; }
        
        .back-btn { background: linear-gradient(90deg, #333, #222); color: #d4af37; border: 1px solid #d4af37; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .back-btn:hover { background: #d4af37; color: #000; }

        .admin-folder { display: none; flex-direction: column; flex-grow: 1; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .admin-folder.active { display: flex; }

        .grid-chart-table { width: 100%; border-collapse: collapse; font-size: 16px; background: #1a1a1a; flex-grow: 1; display: block; overflow-y: auto; margin-top: 5px; border: 1px solid #444; }
        .grid-chart-table th, .grid-chart-table td { border: 1px solid #444; padding: 10px 6px; text-align: center; }
        .grid-chart-table th { background: #262626; color: #d4af37; position: sticky; top: 0; font-size: 15px; z-index: 10; }
        .grid-chart-table tr:nth-child(even) { background: #222; }

        .subadmin-form { background: #222; border: 1px solid #444; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .subadmin-form input, .subadmin-form select, .subadmin-form textarea { width: 100%; background: #1a1a1a; border: 1px solid #555; padding: 10px; border-radius: 6px; color: #fff; margin-bottom: 8px; font-size: 14px; outline: none; }
        .subadmin-item { background: #222; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    </style>
</head>
<body>

    <div id="adminLoginView" class="admin-login-box">
        <h2>👑 SECURE ADMIN LOGIN</h2>
        <input type="tel" id="adminMob" placeholder="Enter Super Mobile No" maxlength="10">
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button class="login-btn" onclick="verifyLogin()">SECURE LOGIN</button>
        <p style="font-size: 11px; color: #888; margin-top: 10px;">Firebase Firestore Live Connected.</p>
    </div>

    <div id="adminDashboardView" class="dashboard-box">
        <div class="dash-header">
            <h3 id="welcomeAdminText">Login Successful!</h3>
            <button onclick="logoutAdmin()" style="background: #b71c1c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">LOGOUT</button>
        </div>

        <div class="menu-bar-container">
            <button class="menu-toggle-btn" onclick="toggleMenu()">☰ MENU / SECTIONS</button>
            <div id="dropdownMenu" class="dropdown-menu">
                <button onclick="switchFolder('frontchart')">📊 Live Bids (00-99)</button>
                <button onclick="switchFolder('contactsettings')">💬 WhatsApp & Telegram Manager</button>
                <button onclick="switchFolder('userpanelctrl')">📢 User Panel Offers & Banner</button>
                <button onclick="switchFolder('subadmins')">👥 Sub-Admin Management (Limit 10)</button>
                <button onclick="switchFolder('results')">🏆 Declare Result</button>
                <button onclick="switchFolder('auditlogs')">📋 Audit Logs Tracker</button>
            </div>
        </div>

        <!-- 1. LIVE BIDS -->
        <div id="folderFrontChart" class="admin-folder active">
            <div class="section-title">📊 LIVE 00 TO 99 BIDS TRACKER</div>
            <select id="frontMarketSelect" onchange="renderFrontGridChart()" style="width: 100%; background: #262626; color: #fff; padding: 10px; border: 1px solid #444; border-radius: 6px; margin-bottom: 6px; font-size: 14px; font-weight: bold; flex-shrink: 0;">
                <option value="DHAN LAXMI">DHAN LAXMI MARKET</option>
                <option value="786">786 MARKET</option>
                <option value="DELHI BAZAR">DELHI BAZAR MARKET</option>
                <option value="SRIGANESH">SRIGANESH MARKET</option>
                <option value="FARIDABAD">FARIDABAD MARKET</option>
                <option value="GHAZIABAD">GHAZIABAD MARKET</option>
                <option value="GALI">GALI MARKET</option>
                <option value="DESAWER">DESAWER MARKET</option>
            </select>
            <table class="grid-chart-table">
                <thead>
                    <tr>
                        <th style="width:15%;">Jodi</th>
                        <th style="width:35%;">Amount (₹)</th>
                        <th style="width:15%;">Jodi</th>
                        <th style="width:35%;">Amount (₹)</th>
                    </tr>
                </thead>
                <tbody id="frontGridTableBody"></tbody>
            </table>
        </div>

        <!-- 2. WHATSAPP & TELEGRAM MANAGER -->
        <div id="folderContactSettings" class="admin-folder">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">💬 WHATSAPP & TELEGRAM MANAGER</div>
            <div class="subadmin-form">
                <label style="font-size:12px; color:#d4af37;">WhatsApp Number (10 digits without +91):</label>
                <input type="tel" id="adminWhatsAppInput" placeholder="e.g. 8076010690" maxlength="10">
                
                <label style="font-size:12px; color:#d4af37; margin-top:8px; display:block;">Telegram Link / Channel URL:</label>
                <input type="text" id="adminTelegramInput" placeholder="e.g. https://telegram.org">
                
                <button class="login-btn" onclick="saveContactSettings()" style="margin-top: 10px; padding: 10px; font-size: 14px;">SAVE & UPDATE LIVE TO FIRESTORE</button>
            </div>
        </div>

        <!-- 3. USER PANEL OFFERS & BANNER -->
        <div id="folderUserPanelCtrl" class="admin-folder">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">📢 USER PANEL OFFERS & BANNER</div>
            <div class="subadmin-form">
                <label style="font-size:12px; color:#d4af37;">Red Scrolling Banner Text:</label>
                <textarea id="redBannerInput" rows="2" placeholder="Banner text"></textarea>
                
                <label style="font-size:12px; color:#d4af37; margin-top:8px; display:block;">Welcome Popup Message:</label>
                <textarea id="popupMsgInput" rows="3" placeholder="Popup message"></textarea>
                
                <button class="login-btn" onclick="saveUserPanelConfig()" style="margin-top: 10px; padding: 10px; font-size: 14px;">UPDATE USER PANEL LIVE</button>
            </div>
        </div>

        <!-- 4. SUB-ADMIN MANAGEMENT -->
        <div id="folderSubAdmins" class="admin-folder">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">👥 SUB-ADMIN MANAGEMENT (Max Limit: 10)</div>
            <div class="subadmin-form">
                <input type="text" id="subName" placeholder="Enter Sub-Admin Name">
                <input type="tel" id="subWhatsapp" placeholder="Enter 10-digit WhatsApp Number" maxlength="10">
                <button class="login-btn" onclick="addSubAdmin()" style="padding: 10px; font-size: 14px;">ADD SUB-ADMIN</button>
            </div>
            <div id="subAdminListContainer" style="margin-top: 10px;"></div>
        </div>

        <!-- 5. RESULTS -->
        <div id="folderResults" class="admin-folder">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">🏆 DECLARE RESULT & PAYOUT</div>
            <div class="subadmin-form">
                <select id="adminMarketSelect" style="width: 100%; background: #262626; color: #fff; padding: 12px; border: 1px solid #444; border-radius: 6px; margin-bottom: 10px;">
                    <option value="DHAN LAXMI">DHAN LAXMI</option>
                    <option value="786">786</option>
                    <option value="DELHI BAZAR">DELHI BAZAR</option>
                    <option value="SRIGANESH">SRIGANESH</option>
                    <option value="FARIDABAD">FARIDABAD</option>
                    <option value="GHAZIABAD">GHAZIABAD</option>
                    <option value="GALI">GALI</option>
                    <option value="DESAWER">DESAWER</option>
                </select>
                <input type="text" id="adminResultInput" placeholder="Enter Winning Number (e.g. 45)" maxlength="2" style="width: 100%; background: #262626; color: #fff; padding: 12px; border: 1px solid #444; border-radius: 6px; margin-bottom: 10px; text-align: center; font-size: 16px;">
                <button class="login-btn" style="padding: 12px; font-size: 15px;" onclick="adminDeclareResult()">DECLARE & UPDATE LIVE TO FIRESTORE</button>
            </div>
        </div>

        <!-- 6. AUDIT LOGS -->
        <div id="folderAuditlogs" class="admin-folder">
            <button class="back-btn" onclick="switchFolder('frontchart')">⬅ BACK TO LIVE BIDS</button>
            <div class="section-title">📋 AUDIT LOGS TRACKER</div>
            <div style="background:#222; padding:10px; border-radius:6px; font-size:12px;" id="auditLogsContainer"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCz-hJxuNnIZcYQhkS1Etshv1C_dhKMSTY",
            authDomain: "royal-satta-1993.firebaseapp.com",
            projectId: "royal-satta-1993",
            storageBucket: "royal-satta-1993.firebasestorage.app",
            messagingSenderId: "565178922133",
            appId: "1:565178922133:web:4ef7e5c32d01b95589579c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let SUPER_ADMINS = {
            "8076010690": "10081993"
        };

        let subAdminsList = [];
        let auditLogs = [];

        let marketBidsData = {
            "DHAN LAXMI": {}, "786": {}, "DELHI BAZAR": {}, "SRIGANESH": {},
            "FARIDABAD": {}, "GHAZIABAD": {}, "GALI": {}, "DESAWER": {}
        };

        Object.keys(marketBidsData).forEach(market => {
            for (let i = 0; i <= 99; i++) {
                let numStr = i < 10 ? '0' + i : '' + i;
                marketBidsData[market][numStr] = 0;
            }
        });

        window.onload = function() {
            let savedAdmin = localStorage.getItem('royal_admin_logged');
            if (savedAdmin) {
                initDashboard();
            }
            loadSettingsFromFirestore();
        };

        function verifyLogin() {
            let mob = document.getElementById('adminMob').value.trim();
            let pass = document.getElementById('adminPass').value.trim();

            if (!mob || !pass) { alert("Kripya Mobile Number aur Password dono daalein!"); return; }

            if (SUPER_ADMINS[mob] && SUPER_ADMINS[mob] === pass) {
                localStorage.setItem('royal_admin_logged', mob);
                initDashboard();
                return;
            }
            alert("Galat Number ya Password hai!");
        }

        function initDashboard() {
            document.getElementById('adminLoginView').style.display = 'none';
            let dash = document.getElementById('adminDashboardView');
            dash.style.display = 'flex';
            document.getElementById('welcomeAdminText').innerText = "SuperAdmin: " + localStorage.getItem('royal_admin_logged');

            fetchLiveBidsFromFirestore();
            renderFrontGridChart();
            loadSettingsFromFirestore();
            loadSubAdminsFromFirestore();
        }

        function fetchLiveBidsFromFirestore() {
            db.collection("bids").onSnapshot((snapshot) => {
                Object.keys(marketBidsData).forEach(m => {
                    for (let i = 0; i <= 99; i++) {
                        let numStr = i < 10 ? '0' + i : '' + i;
                        marketBidsData[m][numStr] = 0;
                    }
                });

                snapshot.forEach((doc) => {
                    let data = doc.data();
                    let mkt = data.market;
                    let num = data.number;
                    let amt = data.amount || 0;

                    if (num && num.startsWith('J-')) {
                        let jodiNum = num.substring(2);
                        if (marketBidsData[mkt] && marketBidsData[mkt][jodiNum] !== undefined) {
                            marketBidsData[mkt][jodiNum] += amt;
                        }
                    }
                });
                renderFrontGridChart();
            });
        }

        function toggleMenu() {
            let menu = document.getElementById('dropdownMenu');
            if (menu) menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function switchFolder(folderName) {
            let menu = document.getElementById('dropdownMenu');
            if (menu) menu.style.display = 'none';

            let allFolders = document.querySelectorAll('.admin-folder');
            allFolders.forEach(folder => folder.classList.remove('active'));

            let folderMap = {
                'frontchart': 'folderFrontChart',
                'contactsettings': 'folderContactSettings',
                'userpanelctrl': 'folderUserPanelCtrl',
                'subadmins': 'folderSubAdmins',
                'results': 'folderResults',
                'auditlogs': 'folderAuditlogs'
            };

            let targetId = folderMap[folderName];
            if (targetId) {
                let targetEl = document.getElementById(targetId);
                if (targetEl) {
                    targetEl.classList.add('active');
                }
            }
        }

        function saveContactSettings() {
            let wp = document.getElementById('adminWhatsAppInput').value.trim();
            let tg = document.getElementById('adminTelegramInput').value.trim();

            if (!wp || wp.length !== 10 || !tg) { 
                alert("Kripya valid 10-digit WhatsApp number aur Telegram link daalein!"); 
                return; 
            }

            db.collection("settings").doc("contact_config").set({
                whatsapp: wp,
                telegram: tg,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                alert("WhatsApp aur Telegram link successfully save ho gaye hain!");
            }).catch(err => {
                alert("Error: " + err.message);
            });
        }

        function saveUserPanelConfig() {
            let redBanner = document.getElementById('redBannerInput').value.trim();
            let popupMsg = document.getElementById('popupMsgInput').value.trim();

            db.collection("settings").doc("userPanel").set({
                redBanner: redBanner,
                popupMsg: popupMsg,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                alert("User Panel settings successfully save ho gayi hain!");
            }).catch(err => {
                alert("Error: " + err.message);
            });
        }

        function addSubAdmin() {
            let name = document.getElementById('subName').value.trim();
            let wp = document.getElementById('subWhatsapp').value.trim();

            if (!name || !wp || wp.length !== 10) {
                alert("Kripya Sub-Admin ka naam aur sahi 10-digit WhatsApp number daalein!");
                return;
            }

            if (subAdminsList.length >= 10) {
                alert("Limit Reached! Aap maximum 10 sub-admin hi add kar sakte hain.");
                return;
            }

            subAdminsList.push({ name: name, whatsapp: wp });

            db.collection("settings").doc("sub_admins").set({
                list: subAdminsList,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Sub-admin successfully add ho gaya hai!");
                document.getElementById('subName').value = '';
                document.getElementById('subWhatsapp').value = '';
                renderSubAdminList();
            }).catch(err => {
                alert("Error: " + err.message);
            });
        }

        function renderSubAdminList() {
            let container = document.getElementById('subAdminListContainer');
            if(!container) return;
            container.innerHTML = '';
            if (subAdminsList.length === 0) {
                container.innerHTML = '<p style="color:#aaa; font-size:13px;">Koi sub-admin add nahi kiya gaya hai.</p>';
                return;
            }
            subAdminsList.forEach((sub, index) => {
                container.innerHTML += `
                    <div class="subadmin-item">
                        <div><b>${sub.name}</b> (${sub.whatsapp})</div>
                        <button onclick="removeSubAdmin(${index})" style="background:#b71c1c; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">REMOVE</button>
                    </div>
                `;
            });
        }

        function removeSubAdmin(index) {
            subAdminsList.splice(index, 1);
            db.collection("settings").doc("sub_admins").set({
                list: subAdminsList,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Sub-admin remove kar diya gaya hai!");
                renderSubAdminList();
            });
        }

        function loadSubAdminsFromFirestore() {
            db.collection("settings").doc("sub_admins").get().then((doc) => {
                if (doc.exists) {
                    let data = doc.data();
                    subAdminsList = data.list || [];
                    renderSubAdminList();
                }
            });
        }

        function loadSettingsFromFirestore() {
            db.collection("settings").doc("contact_config").get().then((doc) => {
                if (doc.exists) {
                    let data = doc.data();
                    if(document.getElementById('adminWhatsAppInput')) document.getElementById('adminWhatsAppInput').value = data.whatsapp || "";
                    if(document.getElementById('adminTelegramInput')) document.getElementById('adminTelegramInput').value = data.telegram || "";
                }
            });

            db.collection("settings").doc("userPanel").get().then((doc) => {
                if (doc.exists) {
                    let data = doc.data();
                    if(document.getElementById('redBannerInput')) document.getElementById('redBannerInput').value = data.redBanner || "";
                    if(document.getElementById('popupMsgInput')) document.getElementById('popupMsgInput').value = data.popupMsg || "";
                }
            });
        }

        function adminDeclareResult() {
            let market = document.getElementById('adminMarketSelect').value;
            let resNum = document.getElementById('adminResultInput').value.trim();
            if (!resNum || resNum.length !== 2) { alert("Sahi 2-digit number daalein!"); return; }

            db.collection("market_results").doc(market).set({
                result: resNum,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                alert(`Result Declared for ${market} -> ${resNum} and saved to Firestore live!`);
                logAction(`Declared result: ${market} -> ${resNum}`);
            }).catch(err => {
                alert("Error: " + err.message);
            });
        }

        function logAction(actText) {
            let timeStr = new Date().toLocaleTimeString();
            auditLogs.unshift({ time: timeStr, action: actText });
            renderAuditLogs();
        }

        function renderAuditLogs() {
            let container = document.getElementById('auditLogsContainer');
            if(!container) return;
            container.innerHTML = '';
            if (auditLogs.length === 0) {
                container.innerHTML = 'No logs yet.';
                return;
            }
            auditLogs.forEach(l => container.innerHTML += `<div style="border-bottom:1px solid #333; padding:4px 0;">[${l.time}] ${l.action}</div>`);
        }

        function renderFrontGridChart() {
            let mkt = document.getElementById('frontMarketSelect').value;
            let tbody = document.getElementById('frontGridTableBody'); 
            if(!tbody) return;
            tbody.innerHTML = '';
            let data = marketBidsData[mkt] || {};
            for (let i = 0; i <= 49; i++) {
                let n1 = i < 10 ? '0' + i : '' + i, n2 = (i + 50) < 10 ? '0' + (i + 50) : '' + (i + 50);
                tbody.innerHTML += `<tr><td><b>${n1}</b></td><td>₹${data[n1] || 0}</td><td><b>${n2}</b></td><td>₹${data[n2] || 0}</td></tr>`;
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('royal_admin_logged');
            location.reload();
        }
    </script>
</body>
</html>
